name: Package

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Test with Apple's Python
        run: /usr/bin/python3 -m unittest discover -s tests -t .
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from tvcast import __version__
          expected = 'v' + __version__
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit('Release tag must match package version: ' + expected)
          PY
      - name: Build and check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/tvcast-smoke"
          "$RUNNER_TEMP/tvcast-smoke/bin/pip" install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tvcast-smoke/bin/tv" --version
          "$RUNNER_TEMP/tvcast-smoke/bin/tv" --help
          "$RUNNER_TEMP/tvcast-smoke/bin/python" - <<'PY'
          from pathlib import Path
          from tvcast.cli import SCRIPT
          from tvcast.server import PANEL_HTML
          assert Path(SCRIPT).is_file(), 'Packaged launcher is missing'
          assert Path(PANEL_HTML).is_file(), 'Web panel is missing'
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tvcast/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
